name: Fe verification
on: [push, pull_request]
permissions:
  contents: read
env:
  FE_VERSION: v26.6.0
jobs:
  fe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe check
      - run: fe fmt --check
      - run: fe test
      - run: fe build
      - name: Test optional offchain helper
        run: python3 -m unittest discover -s tests -v
